name: Build Mac & Linux

# Run it from the Actions tab (Run workflow). The packages appear under the run's "Artifacts".
# Mac builds need a castLabs EVS account for Spotify playback: add the repository secrets
# EVS_ACCOUNT_NAME and EVS_PASSWD (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            files: dist/*.dmg
            name: Winampify-macOS
          - os: ubuntu-latest
            target: --linux
            files: |
              dist/*.AppImage
              dist/*.deb
            name: Winampify-Linux
    runs-on: ${{ matrix.os }}
    env:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
      EVS_NO_ASK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        # electron-builder downloads the castLabs Electron for each target itself
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: "3.12"

      - name: castLabs EVS login (Mac VMP signing)
        if: runner.os == 'macOS' && env.EVS_ACCOUNT_NAME != ''
        run: |
          python -m pip install --upgrade castlabs-evs
          python -m castlabs_evs.account -n reauth

      - name: Build
        run: npx --yes electron-builder@26.18.0 ${{ matrix.target }} --publish never
        env:
          PYTHON: python

      - name: Smoke test (starts and stays up for 25 s)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            BIN="dist/mac-arm64/Winampify.app/Contents/MacOS/Winampify"; RUN=""
          else
            BIN="dist/linux-unpacked/winampify"; RUN="xvfb-run -a"
            ARGS="--no-sandbox --ozone-platform=x11"
          fi
          $RUN "$BIN" $ARGS > run.log 2>&1 &
          sleep 25
          if pgrep -f "$BIN" > /dev/null; then echo "Winampify is running"; ALIVE=1; else echo "::error::Winampify exited early"; ALIVE=0; fi
          echo "----- app output"; cat run.log
          for f in ~/.config/Winampify/winampify.log ~/.config/winampify/winampify.log "$HOME/Library/Application Support/Winampify/winampify.log" "$HOME/Library/Application Support/winampify/winampify.log"; do
            [ -f "$f" ] && { echo "----- page log: $f"; cat "$f"; }
          done
          pkill -f "$BIN" || true
          [ "$ALIVE" = 1 ]

      - name: Note about Mac playback
        if: runner.os == 'macOS' && env.EVS_ACCOUNT_NAME == ''
        run: echo "::warning::No EVS_ACCOUNT_NAME secret, so the Mac build is not VMP-signed and Spotify will not play in it."

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
